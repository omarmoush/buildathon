kind = "web"
previewPath = "/"
title = "Wasta"
description = "Arabic-first furniture ordering for Egyptian workshops and buyers: public bedroom quiz, 3D/AR catalog and generated models, private buyer order links, and an owner dashboard with locked-rate quotes and progress."
version = "1.0.0"
id = "artifacts/wasta"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19364

[services.development]
run = "pnpm --filter @workspace/wasta run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wasta", "run", "build" ]
serve = "static"
publicDir = "artifacts/wasta/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19364"
BASE_PATH = "/"
